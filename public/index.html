<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>PX4 · Gazebo 实时日志</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 40 40"><path d="M20 4 35 30H5L20 4Zm0 8-7.8 14h15.6L20 12Z"/><circle cx="20" cy="25.5" r="2.5"/></svg>
        </div>
        <div>
          <h1>仿真实时日志</h1>
          <p>PX4 · Gazebo Console</p>
        </div>
      </div>
      <div class="connection-pill" id="connectionPill" data-state="connecting">
        <span class="status-dot"></span>
        <span id="connectionText">正在连接</span>
      </div>
    </header>

    <section class="summary-bar" aria-label="状态概览">
      <div class="summary-item"><span>PX4</span><strong id="px4Count">0</strong></div>
      <div class="divider"></div>
      <div class="summary-item"><span>Gazebo</span><strong id="gazeboCount">0</strong></div>
      <div class="divider"></div>
      <div class="summary-item"><span>当前显示</span><strong id="visibleCount">0</strong></div>
      <div class="summary-spacer"></div>
      <div class="memory-note">仅内存缓冲 · 服务重启后清空</div>
    </section>

    <section class="console-card">
      <div class="toolbar">
        <nav class="source-tabs" aria-label="日志来源">
          <button class="tab active" data-source="all">全部 <span id="allBadge">0</span></button>
          <button class="tab" data-source="px4"><i class="source-dot px4"></i>PX4</button>
          <button class="tab" data-source="gazebo"><i class="source-dot gazebo"></i>Gazebo</button>
        </nav>

        <div class="toolbar-actions">
          <label class="search-box">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m2.1-5.4a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z"/></svg>
            <input id="searchInput" type="search" placeholder="搜索日志" autocomplete="off">
            <kbd>Ctrl K</kbd>
          </label>
          <button class="icon-button" id="copyVisibleButton" title="复制当前筛选结果">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="11" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h2"/></svg>
            <span>复制</span>
          </button>
        </div>
      </div>

      <div class="level-filters" id="levelFilters">
        <span class="filter-label">等级</span>
        <button class="level-chip active" data-level="all">全部</button>
        <button class="level-chip" data-level="error"><i class="level-dot error"></i>ERROR</button>
        <button class="level-chip" data-level="warn"><i class="level-dot warn"></i>WARN</button>
        <button class="level-chip" data-level="info"><i class="level-dot info"></i>INFO</button>
        <button class="level-chip" data-level="debug"><i class="level-dot debug"></i>DEBUG</button>
        <label class="follow-toggle">
          <input id="followToggle" type="checkbox" checked>
          <span class="toggle-track"><span></span></span>
          自动跟随
        </label>
      </div>

      <div class="console-wrap">
        <div class="console-head" aria-hidden="true">
          <span>时间</span><span>来源</span><span>等级</span><span>消息</span>
        </div>
        <div class="console-output" id="consoleOutput" tabindex="0" aria-live="polite">
          <div class="empty-state" id="emptyState">
            <div class="empty-icon">›_</div>
            <strong>等待终端日志</strong>
            <span>连接采集命令后，PX4 与 Gazebo 输出将显示在这里</span>
          </div>
          <div id="logRows"></div>
        </div>
        <button class="new-log-button" id="newLogButton" hidden>
          <span>↓</span> <b id="newLogCount">0</b> 条新日志，回到底部
        </button>
      </div>

      <footer class="console-footer">
        <div><span class="footer-dot"></span><span id="footerStatus">准备连接日志服务</span></div>
        <div>内存上限：每来源 <span id="bufferLimit">10,000</span> 行</div>
      </footer>
    </section>
  </main>

  <div class="toast" id="toast" role="status"></div>
  <script src="/app.js" defer></script>
</body>
</html>
